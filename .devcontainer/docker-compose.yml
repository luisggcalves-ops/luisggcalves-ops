services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database's network, so the app reaches Postgres on localhost:5432 like in local development.
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../barberos/scripts/db/init-local.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  pgdata:
