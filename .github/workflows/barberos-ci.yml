name: BarberOS CI

on:
  push:
    paths: ["barberos/**", ".github/workflows/barberos-ci.yml"]
  pull_request:
    paths: ["barberos/**", ".github/workflows/barberos-ci.yml"]

permissions:
  contents: read

concurrency:
  group: barberos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: barberos
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: barberos/package-lock.json
      - name: Create database roles
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/db/init-local.sql
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://barberos_web:barberos_web@localhost:5432/barberos_test
          BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          BETTER_AUTH_URL: http://localhost:3100
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
