<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiftLog &#8212; Workout Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">&#127947;</span>
        <span>LiftLog</span>
      </div>
      <nav>
        <button class="nav-btn active" data-section="log">Log</button>
        <button class="nav-btn" data-section="history">History</button>
        <button class="nav-btn" data-section="progress">Progress</button>
        <button class="nav-btn" data-section="stats">Stats</button>
      </nav>
    </div>
  </header>

  <main>

    <!-- LOG SECTION -->
    <section id="log-section" class="section active">
      <div class="section-header">
        <h2>Log Workout</h2>
        <span id="log-date" style="font-size:0.82rem;color:var(--text-muted)"></span>
      </div>

      <div class="card">
        <form id="log-form" autocomplete="off">
          <div class="form-grid">

            <div class="form-group full-width">
              <label for="exercise-input">Exercise</label>
              <div class="autocomplete-wrapper">
                <input id="exercise-input" type="text" placeholder="e.g. Bench Press" required autocomplete="off" />
                <div id="autocomplete-list" class="autocomplete-list" style="display:none"></div>
              </div>
            </div>

            <div class="form-group full-width sets-container">
              <label>Sets</label>
              <div class="sets-list" id="sets-list"></div>
              <button type="button" class="add-set-btn" id="add-set-btn">+ Add Set</button>
            </div>

            <div class="form-group full-width">
              <label for="notes-input">
                Notes
                <span style="font-weight:400;text-transform:none;color:var(--text-muted)">(optional)</span>
              </label>
              <input id="notes-input" type="text" placeholder="e.g. Felt strong today" />
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" id="clear-form-btn">Clear</button>
              <button type="submit" class="btn btn-primary">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                Save Workout
              </button>
            </div>

          </div>
        </form>
      </div>

      <!-- Today's entries list -->
      <div id="today-workouts">
        <h3 style="margin-bottom:0.75rem;color:var(--text-secondary);font-size:0.9rem;
                   text-transform:uppercase;letter-spacing:0.05em;">Today's Entries</h3>
        <div id="today-list"></div>
      </div>
    </section>

    <!-- HISTORY SECTION -->
    <section id="history-section" class="section">
      <div class="section-header">
        <h2>History</h2>
        <button class="btn btn-danger btn-sm" id="clear-all-btn">Clear All</button>
      </div>
      <div class="filter-bar">
        <input id="history-search" type="text" placeholder="Search exercise..." />
        <input id="history-date" type="date" />
      </div>
      <div id="history-list"></div>
    </section>

    <!-- PROGRESS SECTION -->
    <section id="progress-section" class="section">
      <div class="section-header">
        <h2>Progress</h2>
      </div>

      <div class="progress-controls">
        <select id="progress-exercise">
          <option value="">-- Select exercise --</option>
        </select>
        <div class="metric-tabs">
          <button class="metric-tab active" data-metric="weight">Weight</button>
          <button class="metric-tab" data-metric="reps">Reps</button>
          <button class="metric-tab" data-metric="volume">Volume</button>
          <button class="metric-tab" data-metric="1rm">Est. 1RM</button>
        </div>
      </div>

      <!-- PR banner for selected exercise -->
      <div id="exercise-prs" class="pr-banner" style="display:none"></div>

      <!-- Chart area -->
      <div class="chart-wrapper">
        <div id="chart-placeholder" class="chart-placeholder">
          Select an exercise above to view your progress chart.
        </div>
        <canvas id="progress-chart" style="display:none;max-height:320px;"></canvas>
      </div>

      <!-- Best sets table -->
      <div id="best-sets-section" style="display:none">
        <h3 style="margin-bottom:0.75rem">Best Sets</h3>
        <div class="card">
          <table class="sets-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Set</th>
                <th>Reps</th>
                <th>Weight</th>
                <th>Volume</th>
                <th>Est. 1RM</th>
              </tr>
            </thead>
            <tbody id="best-sets-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- STATS SECTION -->
    <section id="stats-section" class="section">
      <div class="section-header">
        <h2>Stats</h2>
      </div>
      <div class="stats-grid" id="stats-grid"></div>
      <h3 style="margin-bottom:0.75rem">All-time PRs</h3>
      <div id="all-prs-list"></div>
    </section>

  </main>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Confirm modal -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3 id="modal-title">Confirm</h3>
    <p id="modal-body">Are you sure?</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
