<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Teamsheet</title>
  <meta name="description" content="Five-a-side, sorted. Tap In, Maybe or Out for this week's game." />
  <meta name="theme-color" content="#0e1512" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

</head>
<body>
  <div id="app"><div class="loading">Loading…</div></div>

  <!-- 3. Teamsheet itself -->

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
